[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "road-accidents"
version = "0.1.0"
description = "Reproducible weekly accident prediction on federal road segments in Minas Gerais"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7,<1",
    "duckdb>=1.5,<1.6",
    "dvc>=3.67,<4",
    "filelock>=3.20,<4",
    "geopandas>=1.1,<1.2",
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "mlflow>=3.16,<4",
    "networkx>=3.5,<4",
    "numpy>=2,<3",
    "osmnx>=2.1,<2.2",
    "pandas>=2.2,<3.1",
    "pandera[pandas]>=0.33,<0.34",
    "psutil>=7,<8",
    "pyarrow>=25,<26",
    "pydantic>=2.11,<3",
    "pyproj>=3.7,<4",
    "pyyaml>=6,<7",
    "scikit-learn>=1.9,<1.10",
    "scipy>=1.15,<2",
    "shapely>=2.1,<3",
    "torch>=2.14,<2.15",
    "torch-geometric>=2.8,<2.9",
    "typer>=0.27,<0.28",
    "xgboost>=3.4,<3.5",
]

[project.scripts]
road-risk = "road_accidents.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "packaging>=26.3,<27",
    "pip-audit>=2.9,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-socket>=0.7,<1",
    "ruff>=0.12,<1",
    "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/road_accidents"]

[[tool.uv.index]]
name = "approved-pypi"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket"
markers = ["external: requires explicitly approved real sources or external services"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "pandas.*", "pyarrow.*", "networkx.*", "defusedxml.*", "shapely.*", "dvc.*", "sklearn.*", "torch_geometric.*", "psutil.*"]
ignore_missing_imports = true